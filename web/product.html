<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--SEO-->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/s/app.css">
<style>
  .phead{display:grid;gap:18px;margin:20px 0 0}
  /* біла плитка в ОБОХ темах: фото крамниць — це або JPEG із білим тлом, або PNG із
     прозорістю; на темній плитці перші світились білими дірами, другі тонули */
  .phead .pic{width:100%;max-width:280px;aspect-ratio:1;border-radius:var(--radius);
    background:#fff;border:1px solid var(--line);object-fit:contain;padding:10px}
  /* коли фото немає, .pic — це <div> зі значком: центруємо його */
  .phead .pic.ph{display:flex;align-items:center;justify-content:center}
  .phead h1{margin:0 0 6px;font-size:var(--f5);line-height:1.25;letter-spacing:-.02em}
  .pbuy{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:12px 0 4px}
  .pbuy .now{font-size:var(--f6)}
  .offer{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .offer:last-child{border-bottom:none}
  .offer .st{font-weight:650;font-size:var(--f3)}
  .offer .pr{font-weight:750;font-size:var(--f4);margin-left:auto}
  .win{background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:var(--radius-s);
    padding:12px 14px;margin:0 0 4px}
  .specs{display:grid;grid-template-columns:1fr;gap:0}
  .specs .sr{display:flex;justify-content:space-between;gap:16px;padding:9px 0;
    border-bottom:1px solid var(--line);font-size:var(--f3)}
  .specs .sr:last-child{border-bottom:none}
  .specs .k{color:var(--muted)}
  @media (min-width:1000px){
    .phead{grid-template-columns:280px 1fr;align-items:start;gap:30px}
    .specs{grid-template-columns:1fr 1fr;column-gap:34px}
  }
</style>
</head>
<body>
<div class="app">
<header id="hdr"></header>
<nav id="crumbs" hidden></nav>
<div class="page">
  <div id="msg" class="msg"></div>
  <div id="head" class="phead"><!--SUMMARY--></div>
  <div class="panel gap-l" id="hist"></div>
  <div class="panel" id="offers"></div>
  <div class="panel" id="specs" hidden></div>
</div>
<div id="ftr"></div>
</div>

<script src="/s/app.js"></script>
<script>
renderHeader('/catalog');
renderFooter();

const SPID = parseInt(location.pathname.split('/').pop(), 10);
function say(t, k){ const m=document.getElementById('msg');
  m.className='msg on '+(k||'ok'); m.textContent=t; if(!t) m.className='msg'; }

/* Картку беремо з /card, а не з /offers: той навмисно бідний (крамниця+ціна+URL) і не
   несе ні фото, ні бейджа, ні 30-денної бази — тобто саме того, заради чого сторінка. */
async function load(){
  if (!Number.isInteger(SPID)) { say('Невідомий товар', 'err'); return; }
  let me = null, offers = [];
  try {
    [me, offers] = await Promise.all([
      api(`/api/product/${SPID}/card`),
      api(`/api/product/${SPID}/offers`).catch(() => []),
    ]);
  } catch(e){
    document.getElementById('head').innerHTML =
      `<div class="empty"><div class="ic">${icon('tag')}</div><div class="t">Товар не знайдено</div>
       <div>Можливо, він зник із продажу.</div></div>`;
    return;
  }

  document.title = me.title + ' — Хапай';
  // Крихти ведуть у КАТЕГОРІЮ товару, а не просто в каталог: інакше «назад» кидало б
  // у загальний список, з якого людина сюди не приходила.
  renderCrumbs([
    {href:'/', label:'Головна'},
    {href:'/catalog', label:'Знижки'},
    ...(me.category_slug
        ? [{href:'/catalog?c=' + encodeURIComponent(me.category_slug),
            label: me.category || me.category_slug}] : []),
    {label: me.title},
  ]);
  const off = pct(me);
  window.__cur = me.current_kop;                 // щоб мінімум міг сказати «зараз саме така»
  const bt = BADGE_TEXT[me.badge_state] || '';   // порожньо = мітки нема
  document.getElementById('head').innerHTML = `
    ${me.image_url ? `<img class="pic" src="${esc(me.image_url)}" alt="${esc(me.title)}">`
                   : `<div class="pic ph">${PH_SVG}</div>`}
    <div>
      <h1>${esc(me.title)}</h1>
      <div class="meta"><b>${esc(me.store||'')}</b>${me.variant_note?' · '+esc(me.variant_note):''}</div>
      ${me.product_id ? `<div class="meta" style="margin-top:4px">
        <a href="/model/${me.product_id}">Ця сама модель в інших крамницях →</a></div>` : ''}
      <div class="pbuy">
        <span class="now">${grn(me.current_kop)}</span>
        ${me.old_declared_kop?`<span class="old">${grn(me.old_declared_kop)}</span>`:''}
        ${off?`<span class="off flat">−${off}%</span>`:''}
      </div>
      ${bt ? `<span class="badge"><span class="dot"></span>${bt}</span>` : ''}
      <div class="actions">
        <a class="btn btn-main" href="${esc(me.url)}" target="_blank" rel="noopener">Відкрити в крамниці →</a>
        <button class="btn btn-ghost" id="watch">Стежити за ціною</button>
      </div>
      <div id="watchbox" hidden class="gap-s">
        <label for="tgt" class="flabel">Сповістити, коли ціна впаде до (₴)</label>
        <input id="tgt" class="search trunc" inputmode="numeric" placeholder="необовʼязково">
        <button class="mini gap-left" id="watchgo">Стежити</button>
      </div>
      <div id="low" class="prov"></div>
    </div>`;

  /* Цільова ціна (S29): «повідом, коли впаде нижче X». Досі ми сповіщали про будь-яке
     зниження — це шум: людина хоче знати не «подешевшало на 40 грн», а «дійшло до моєї
     ціни». Порожнє поле = стара поведінка, тож нікого не змушуємо називати число. */
  document.getElementById('watch').onclick = async () => {
    if (!AUTH.in){ location.href = '/login'; return; }
    const box = document.getElementById('watchbox');
    if (box && box.hidden){ box.hidden = false;
      const f = box.querySelector('input'); if (f) f.focus(); return; }
    const raw = box ? box.querySelector('input').value.replace(/[^\d]/g,'') : '';
    const target = raw ? parseInt(raw, 10) * 100 : null;   // гривні → копійки (інв. A)
    try{
      await api('/api/me/watchlist', {method:'POST',
        body: JSON.stringify({kind:'store_product', ref_id: SPID, target_kop: target})});
      say(target
        ? `Стежимо. Напишемо, щойно ціна впаде до ${grn(target)} або нижче.`
        : 'Стежимо. Напишемо, щойно ціна знизиться.', 'ok');
      if (box) box.hidden = true;
    }catch(e){ say(e.message, 'err'); }
  };

  loadLow();

  const wg = document.getElementById('watchgo');
  if (wg) wg.onclick = () => document.getElementById('watch').click();

  renderOffers(offers, me);
  loadHistory(me);
  loadSpecs();
}

function renderOffers(offers, me){
  const box = document.getElementById('offers');
  if (offers.length < 2){
    box.innerHTML = `<h2>Де купити</h2>
      <div class="sub">Поки бачимо цей товар лише в одній крамниці.</div>`;
    loadChoice(box);
    return;
  }
  box.innerHTML = `<h2>Де купити</h2><div class="sub">${plu(offers.length,'пропозиція','пропозиції','пропозицій')}</div>`
    + offers.map(o => `<div class="offer">
        <div><div class="st">${esc(o.store)}</div>
          ${o.old_declared_kop?`<span class="old">${grn(o.old_declared_kop)}</span>`:''}</div>
        <div class="pr">${grn(o.current_kop)}</div>
        <a class="mini" href="${esc(o.url)}" target="_blank" rel="noopener">У крамницю</a>
      </div>`).join('');
  loadChoice(box);
}

/* «Наш вибір» (S9): не найдешевша ціна, а найвигідніший спосіб купити — з доставкою
   й самовивозом. Сервер повертає null, коли порівнювати нема з чим. */
async function loadChoice(box){
  try{
    const r = await api(`/api/product/${SPID}/choice`);
    const c = r.choice;
    if (!c) return;
    box.insertAdjacentHTML('afterbegin', `<div class="win">
      <div class="t" style="font-weight:700">🏆 ${esc(c.our_choice)}</div>
      <div class="s">${c.savings_kop ? 'Вигідніше за наступну пропозицію на ' + grn(c.savings_kop)
                                     : 'Найвигідніший спосіб купити за нашим підрахунком'}</div>
    </div>`);
  }catch(e){}
}

async function loadHistory(me){
  const box = document.getElementById('hist');
  box.innerHTML = `<h2>Історія ціни</h2><div class="sub">Завантаження…</div>`;
  try{
    const hist = await api(`/api/product/${SPID}/history`);
    const W = Math.max(280, box.clientWidth - 44);
    // Чим ширша колонка, тим вищий графік — інакше на десктопі виходило 6:1 і рух ціни
    // ставав пласким. Та сама висота йде і в CSS, і у viewBox: не розтягуємо картинку.
    const CH = W > 700 ? 210 : 158;
    box.style.setProperty('--chart-h', CH + 'px');
    const ref = me.reference_kop != null
      ? `За нашими спостереженнями ціна за 30 днів <b>не була нижчою за ${grn(me.reference_kop)}</b> — сірий пунктир.`
      : 'Історія ще накопичується — статутну базу за 30 днів рахуємо з часом.';
    const meas = hist.reduce((a,p) => a + (p.n||0), 0);
    const days = hist.length > 1
      ? Math.round((Date.parse(hist[hist.length-1].day) - Date.parse(hist[0].day))/86400000) + 1
      : hist.length;
    const basis = hist.length ? `Основа: <b>${plu(meas,'вимір','виміри','вимірів')}</b> у ${hist.length} з ${plu(days,'доби','діб','діб')}.
      Лінія тримає останній вимір до наступного; пунктир — проміжки без вимірів.
      <b>Між вимірами ціна могла змінюватись — ми цього не фіксували.</b>` : '';
    box.innerHTML = `<h2>Історія ціни</h2>${sparkline(hist, me.reference_kop, W, CH)}
      <div class="prov">${ref} ${basis}</div>`;
  }catch(e){
    box.innerHTML = `<h2>Історія ціни</h2><div class="sub">Не вдалося завантажити історію.</div>`;
  }
}

/* Історичний мінімум (S29). ⚠ Формулювання НЕСЕ ВІКНО: «за 11 днів спостережень», а
   не «за весь час». Історія почалась 18.07, і «найнижча за весь час» було б самообманом
   того самого сорту, який ми ловимо в крамниць — твердження без власного вікна не
   перевірити (T12). */
async function loadLow(){
  const box = document.getElementById('low');
  if (!box) return;
  try{
    const l = await api(`/api/product/${SPID}/low`);
    if (l.low_kop == null || !l.days) { box.remove(); return; }

    /* ⚠ ДВА РІЗНІ ТВЕРДЖЕННЯ, залежно від глибини даних (S31).
       Поки вікно коротше за 30 днів, «найнижча за весь час» дублювала б блок історії
       слово в слово. Але мовчати теж неправильно: 27 тисяч знижок у нас без вердикту,
       і людина не розуміє ЧОМУ. Тому кажемо прямо, скільки ще чекати — це перетворює
       нашу слабкість на демонстрацію методу. Ніхто не показує власну неготовність. */
    if (l.days <= 30){
      const left = 30 - l.days;
      box.innerHTML = `Стежимо за цією ціною <b>${plu(l.days,'день','дні','днів')}</b>
        із 30 потрібних (${plu(l.measurements,'вимір','виміри','вимірів')} з
        ${esc(l.first_day)}). Щоб перевірити «стару» ціну за законом, потрібні
        спостереження за повні 30 днів — ще ${plu(left,'день','дні','днів')}.
        <a href="/how">Чому саме 30 →</a>`;
      return;
    }
    const isLow = l.low_kop === (window.__cur ?? null);
    box.innerHTML = `За <b>${plu(l.days,'день','дні','днів')}</b> наших спостережень
      (${plu(l.measurements,'вимір','виміри','вимірів')} з ${esc(l.first_day)})
      найнижча ціна була <b>${grn(l.low_kop)}</b>${l.low_day ? ' — ' + esc(l.low_day) : ''}.
      ${isLow ? '<b>Зараз ціна саме така.</b>' : ''}`;
  }catch(e){ box.remove(); }
}

async function loadSpecs(){
  try{
    const r = await api(`/api/product/${SPID}/specs`);
    const s = r.specs;
    if (!s || !s.attrs || !s.attrs.length) return;
    const box = document.getElementById('specs');
    box.hidden = false;
    box.innerHTML = `<h2>Характеристики</h2>
      <div class="specs">${s.attrs.map(a =>
        `<div class="sr"><span class="k">${esc(a.name)}</span><span>${esc(a.value)}</span></div>`).join('')}</div>
      <div class="prov">Джерело: картка ${esc(s.store)}${
        s.collected_day ? ', ' + esc(s.collected_day) : ''}.</div>`;
  }catch(e){}
}

load();
</script>
</body>
</html>
