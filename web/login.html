<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--SEO-->
<link rel="stylesheet" href="/s/app.css">
</head>
<body>
<div class="app">
<header id="hdr"></header>

<div class="form" id="form"></div>
<!-- Видно лише коли вхід відкрили з наміром (?next=): людина має бачити, що
     її не викине в порожній кабінет. -->
<p class="hint" id="backhint" hidden style="text-align:center;max-width:400px;margin:10px auto 0">
  Після входу повернемо вас туди, звідки ви прийшли.</p>

<div id="ftr"></div>
</div>

<script src="/s/app.js"></script>
<script>
renderHeader('/login');
renderFooter();

const F = document.getElementById('form');
let mode = new URLSearchParams(location.search).get('m') || 'login';

function say(text, kind){
  const m = document.getElementById('msg');
  if (!m) return;
  m.className = 'msg on ' + (kind || 'ok');
  m.textContent = text;
}

function draw(){
  if (mode === 'login') F.innerHTML = `
    <h1>Вхід</h1>
    <p class="lead">Акаунт потрібен, щоб стежити за ціною товару й отримувати сповіщення
      про зниження.</p>
    <label for="e">Email</label><input id="e" type="email" autocomplete="username">
    <label for="p">Пароль</label><input id="p" type="password" autocomplete="current-password">
    <button class="btn btn-main" id="go">Увійти</button>
    <div id="msg" class="msg"></div>
    <div class="alt">Немає акаунта? <a href="?m=register">Зареєструватись</a></div>
    <div class="alt"><a href="?m=forgot">Забув пароль</a></div>`;

  else if (mode === 'register') F.innerHTML = `
    <h1>Реєстрація</h1>
    <p class="lead">Потрібні лише email і пароль. Далі надішлемо лист і попросимо увійти — так ми не підказуємо стороннім, які адреси в нас зареєстровані.</p>
    <label for="e">Email</label><input id="e" type="email" autocomplete="username">
    <label for="p">Пароль</label><input id="p" type="password" autocomplete="new-password"
      placeholder="щонайменше 8 символів">
    <button class="btn btn-main" id="go">Створити акаунт</button>
    <div id="msg" class="msg"></div>
    <div class="alt">Вже є акаунт? <a href="?m=login">Увійти</a></div>`;

  else if (mode === 'forgot') F.innerHTML = `
    <h1>Відновлення пароля</h1>
    <p class="lead">Надішлемо код на пошту. Введи його разом із новим паролем.</p>
    <label for="e">Email</label><input id="e" type="email" autocomplete="username">
    <button class="btn btn-main" id="go">Надіслати код</button>
    <div id="msg" class="msg"></div>
    <div class="alt"><a href="?m=reset">Код уже маю</a> · <a href="?m=login">Увійти</a></div>`;

  else if (mode === 'reset') F.innerHTML = `
    <h1>Новий пароль</h1>
    <p class="lead">Введи email, код із листа та новий пароль.</p>
    <label for="e">Email</label><input id="e" type="email" autocomplete="username">
    <label for="c">Код із листа</label><input id="c" inputmode="numeric" autocomplete="one-time-code">
    <label for="p">Новий пароль</label><input id="p" type="password" autocomplete="new-password">
    <button class="btn btn-main" id="go">Змінити пароль</button>
    <div id="msg" class="msg"></div>
    <div class="alt"><a href="?m=login">Повернутись до входу</a></div>`;

  const go = document.getElementById('go');
  go.onclick = submit;
  F.querySelectorAll('input').forEach(i =>
    i.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); }));
}

async function submit(){
  const v = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  const btn = document.getElementById('go');
  btn.disabled = true;
  try{
    if (mode === 'login'){
      const r = await api('/api/auth/login', {method:'POST',
        body: JSON.stringify({email: v('e'), password: document.getElementById('p').value})});
      AUTH.set(r.token, r.email);
      location.href = NEXT || '/me';
      return;
    }
    if (mode === 'register'){
      // Сервер відповідає ОДНАКОВО на нову й на вже зареєстровану адресу — інакше
      // сама відповідь казала б, чи є в нас такий акаунт. Тому й тут повідомлення
      // однакове, і токена ми не отримуємо: людина входить звичайним паролем.
      await api('/api/auth/register', {method:'POST',
        body: JSON.stringify({email: v('e'), password: document.getElementById('p').value})});
      say('Готово. Ми надіслали лист на цю адресу — далі увійди своїм паролем.', 'ok');
      setTimeout(() => { mode = 'login'; history.replaceState(null,'','?m=login'); draw();
        document.getElementById('e').value = v('e'); }, 1800);
      return;
    }
    if (mode === 'forgot'){
      // Сервер ЗАВЖДИ відповідає 200 — щоб не можна було перебором дізнатись, які
      // адреси зареєстровані. Тому й повідомлення тут однакове в обох випадках.
      await api('/api/auth/reset/request', {method:'POST', body: JSON.stringify({email: v('e')})});
      say('Якщо така адреса в нас є — лист із кодом уже в дорозі.', 'ok');
      setTimeout(() => { mode = 'reset'; history.replaceState(null,'','?m=reset'); draw();
        document.getElementById('e').value = v('e'); }, 1600);
      return;
    }
    if (mode === 'reset'){
      await api('/api/auth/reset/confirm', {method:'POST', body: JSON.stringify({
        email: v('e'), code: v('c'), new_password: document.getElementById('p').value})});
      say('Пароль змінено. Тепер увійди з новим.', 'ok');
      setTimeout(() => { mode = 'login'; history.replaceState(null,'','?m=login'); draw(); }, 1500);
      return;
    }
  } catch(err){
    say(err.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

/* Куди повернутись після входу (S35). Заміряно: людина, яка натиснула «Стежити за
   ціною» на товарі, після реєстрації опинялась у порожньому кабінеті й мусила
   шукати той товар заново — намір губився повністю.
   safeNext пропускає ЛИШЕ внутрішній шлях: `next` із чужим доменом — це відкритий
   редирект, класична дірка, через яку фішинг ходить під нашою адресою. */
const NEXT = safeNext(new URLSearchParams(location.search).get('next'));
if (NEXT) {
  const back = document.getElementById('backhint');
  if (back){ back.hidden = false; }
}
if (AUTH.in) location.replace(NEXT || '/me');   // уже увійшов — форма ні до чого
else draw();
</script>
</body>
</html>
