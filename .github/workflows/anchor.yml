name: anchor-seals

# ЗОВНІШНІЙ ЯКІР для щоденних печаток спостережень (S31).
#
# Навіщо. Корінь Меркла, що живе лише в НАШІЙ базі, доводить менше, ніж здається: ми
# теоретично могли б перерахувати весь ланцюг після підміни. Винесення коренів у
# ПУБЛІЧНИЙ репозиторій (O8) закриває цю дірку: git-історія видима, і підробка
# означала б переписування публічної історії — а це помітно.
#
# Секретів не потрібно: /api/verify — публічний ендпойнт, у ньому лише хеші.

on:
  schedule:
    - cron: "40 1 * * *"       # щодня 01:40 UTC — після того, як seal.py запечатав добу
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: anchor
  cancel-in-progress: false

jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Забрати печатки з продакшену
        run: |
          curl -sS --fail --max-time 30 https://hapay.today/api/verify > /tmp/verify.json
          python - <<'PY'
          import json, pathlib
          d = json.load(open('/tmp/verify.json'))
          out = pathlib.Path('verify')
          out.mkdir(exist_ok=True)
          # Один файл на добу: рядок, який КОЛИСЬ ЗАКОМІЧЕНО, більше не змінюється —
          # саме в цьому й сенс якоря. Перезапис наявного файлу вважаємо помилкою.
          for s in d['seals']:
              f = out / f"{s['day']}.json"
              body = json.dumps({
                  'day': s['day'], 'rows_n': s['rows_n'],
                  'merkle_root': s['merkle_root'], 'chain': s['chain'],
                  'format': d.get('format', 'merkle-sha256-v1'),
              }, ensure_ascii=False, indent=1, sort_keys=True) + '\n'
              if f.exists():
                  if f.read_text(encoding='utf-8') != body:
                      raise SystemExit(
                          f'❌ печатка {s["day"]} У РЕПО ВІДРІЗНЯЄТЬСЯ від продакшену — '
                          f'це або підміна історії, або збій. Розбиратися вручну.')
                  continue
              f.write_text(body, encoding='utf-8')
              print('якір:', f)
          PY

      - name: Закомітити якір
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verify/
          if git diff --cached --quiet; then
            echo "нових печаток немає"
          else
            git commit -m "anchor: печатки спостережень $(date -u +%F)"
            git push
          fi
